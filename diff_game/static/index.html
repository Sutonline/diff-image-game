<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片找茬游戏比对工具 - Spot The Difference</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>🎯 找茬游戏自动对比工具</h1>
        <span class="badge">纯本地 CV 引擎 / 零大模型依赖</span>
      </div>
    </header>

    <main class="app-main">
      <!-- 控制侧边栏 -->
      <aside class="sidebar">
        <section class="card upload-card">
          <h2>1. 上传游戏截图</h2>
          <div id="dropZone" class="drop-zone">
            <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p>点击选择或拖拽图片至此</p>
            <span class="subtext">支持直接 <strong>Ctrl / Cmd + V</strong> 粘贴截图</span>
            <input type="file" id="fileInput" accept="image/*" hidden>
          </div>
          <div id="fileNameDisplay" class="file-info hidden"></div>
        </section>

        <section class="card settings-card">
          <h2>2. 参数微调</h2>

          <div class="form-group">
            <label for="splitMode">切分模式</label>
            <select id="splitMode">
              <option value="auto">⚡ 自动判断 (支持手机长图与左右并排)</option>
              <option value="horizontal">↔️ 左右并排 (水平)</option>
              <option value="vertical">↕️ 上下并排 (垂直)</option>
            </select>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="diffThreshold">敏感度 (阈值)</label>
              <span id="diffThresholdVal" class="val-badge">18</span>
            </div>
            <input type="range" id="diffThreshold" min="5" max="100" value="18">
            <span class="hint">越低越敏感（能发现细微色差），越高越严格</span>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="minArea">噪点过滤面积 (px²)</label>
              <span id="minAreaVal" class="val-badge">50</span>
            </div>
            <input type="range" id="minArea" min="5" max="500" value="50">
            <span class="hint">过滤掉小于该面积的微小散斑与噪波</span>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="blurRadius">滤波去噪半径</label>
              <span id="blurRadiusVal" class="val-badge">3</span>
            </div>
            <input type="range" id="blurRadius" min="1" max="15" step="2" value="3">
            <span class="hint">平滑自然渐变色与压缩边缘</span>
          </div>

          <button id="compareBtn" class="btn primary-btn" disabled>
            开始对比检测
          </button>
        </section>
      </aside>

      <!-- 结果展示主区域 -->
      <section class="content-area">
        <!-- 差异统计条 (纯统计，不堆叠坐标列表) -->
        <div id="statusBanner" class="status-banner hidden">
          <div class="stat-item">
            <span class="stat-label">差异数量:</span>
            <span id="diffCount" class="stat-value highlight">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">切分排布:</span>
            <span id="activeMode" class="stat-value">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">计算耗时:</span>
            <span id="execTime" class="stat-value">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-badge">🛡️ 红圈互斥无重叠</span>
          </div>
        </div>

        <!-- 图片展示卡片 -->
        <div class="card preview-card">
          <div id="emptyState" class="empty-state">
            <div class="empty-icon">🖼️</div>
            <h3>等待上传游戏截图</h3>
            <p>在左侧上传或使用 <strong>Cmd/Ctrl+V</strong> 粘贴截图，系统自动标出所有差异</p>
          </div>

          <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>正在分析比对并合并差异...</p>
          </div>

          <!-- 结果图片 (点击看图放大) -->
          <div id="resultViewer" class="result-viewer hidden">
            <div class="image-box" title="点击放大查看">
              <img id="annotatedImage" alt="比对结果图">
              <div class="zoom-hint">🔍 点击放大图片</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 轻量看图放大遮罩层 (点击外部或图片即缩小关闭) -->
  <div id="lightboxOverlay" class="lightbox-overlay hidden" title="点击任意空白处缩小返回">
    <div class="lightbox-content">
      <img id="lightboxImage" alt="放大预览">
      <div class="lightbox-close-hint">点击外部任意区域或按 ESC 缩小退出</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
